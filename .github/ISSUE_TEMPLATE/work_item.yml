name: 작업 이슈
description: 버그, 기능, 정책, 기술 부채 작업을 기록합니다.
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        문제만 적는 이슈보다, 확인 근거와 해결 방향을 함께 남겨야 다음 작업자가 바로 움직일 수 있습니다.
        간단한 이슈라도 "어떤 식으로 고치면 되는지"를 짧게 적어 주세요.
  - type: textarea
    id: context
    attributes:
      label: 배경 / 문제
      description: 사용자 경험, 정책 리스크, 버그, 기술 부채가 무엇인지 적습니다.
      placeholder: 어떤 상황에서 무엇이 문제인지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 확인 근거
      description: 관련 파일, 코드 위치, 로그, 공식 문서, 재현 경로 등을 적습니다.
      placeholder: 예) withu/ContentView.swift의 하드코딩 문자열, Apple 공식 문서 링크 등
    validations:
      required: true
  - type: textarea
    id: implementation_direction
    attributes:
      label: 해결 방향
      description: 바로 구현 가능한 수준으로 접근 방법을 짧게 제안합니다. 여러 선택지가 있으면 추천안을 먼저 적습니다.
      placeholder: 예) Localizable.xcstrings를 추가하고 ko/en 문자열을 분리한 뒤, InfoPlist.strings로 권한 문구를 지역화한다.
    validations:
      required: true
  - type: textarea
    id: acceptance_criteria
    attributes:
      label: 완료 기준
      description: 이슈를 닫을 수 있는 확인 조건을 체크리스트 형태로 적습니다.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: overlap
    attributes:
      label: 기존 이슈 / PR 중복 확인
      description: 겹치는 기존 이슈나 PR, sub-issue/linked issue 관계, 작업 브랜치를 적습니다.
      placeholder: 예) #12의 일부 작업. 브랜치 task/12-review-notes에서 진행.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 참고 / 범위 밖
      description: 이번 이슈에서 다루지 않는 내용, 후속 이슈 후보, 리뷰어가 알아야 할 제약을 적습니다.
    validations:
      required: false
